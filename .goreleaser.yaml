version: 2

project_name: urso

gomod:
  # https://goreleaser.com/customization/verifiable_builds/?h=proxy
  proxy: true
  env:
    - GOPROXY=https://proxy.golang.org,direct
    - GOSUMDB=sum.golang.org
  # gobinary: go1.25

before:
  hooks:
    - go mod tidy
    - sh ./scripts/completions.sh

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # ensures mod timestamp to be the commit timestamp
    mod_timestamp: "{{ .CommitTimestamp }}"
    main: ./cmd/urso

source:
  enabled: true
  name_template: "{{ .ProjectName }}.src"

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    wrap_in_directory: true
    builds_info:
      mtime: "{{ .CommitTimestamp }}"
    files:
      - completions/*

sboms:
  - artifacts: archive
  - id: source
    artifacts: source

checksum:
  name_template: "checksums.txt"

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

homebrew_casks:
  - name: urso
    repository:
      owner: urso-run
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_RELEASER_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://urso.run"
    description: "Urso is a GitHub Actions runner manager"
    binaries:
      - urso
    completions:
      bash: completions/urso.bash
      zsh: completions/urso.zsh
      fish: completions/urso.fish

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
